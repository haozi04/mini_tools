<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MLFB & Option Code Processor</title>
  <meta name="description" content="Paste Excel data with MLFB codes and option codes, validate and normalize them for PMD." />
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/header.css" />
  <style>
    :root {
      --border-input:  #d5dce8;
      --btn-sec-bg:    #f4f6fb;
      --btn-sec-text:  #5b6884;
      --btn-sec-bdr:   #c9d2e2;
      --btn-sec-hover: #e9eef7;
      --copy-bg:       #f4f6fb;
      --copy-bdr:      #c9d2e2;
      --copy-text:     #5b6884;
      --copy-done-bg:  #e6f7ec;
      --copy-done-text:#1a7a4a;
      --copy-done-bdr: #b9e6cd;
      --status-ok-bg:    #e6f7ec;
      --status-ok-text:  #1a7a4a;
      --status-ok-bdr:   #b9e6cd;
      --status-warn-bg:  #fdf1d4;
      --status-warn-text:#8a5a00;
      --status-warn-bdr: #f3d999;
    }

    [data-theme="dark"] {
      --border-input:  #263353;
      --btn-sec-bg:    #1c2740;
      --btn-sec-text:  #9fb0d0;
      --btn-sec-bdr:   #33415f;
      --btn-sec-hover: #263353;
      --copy-bg:       #0b101d;
      --copy-bdr:      #263353;
      --copy-text:     #8b96ad;
      --copy-done-bg:  #0f2a1c;
      --copy-done-text:#9fe870;
      --copy-done-bdr: #2a4a3a;
      --status-ok-bg:    #0f2a1c;
      --status-ok-text:  #9fe870;
      --status-ok-bdr:   #2a4a3a;
      --status-warn-bg:  #2e2205;
      --status-warn-text:#f3d999;
      --status-warn-bdr: #6b4f0d;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 20px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .card h2 {
      font-family: "Chakra Petch", sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .settings-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .settings-row label {
      font-family: "Chakra Petch", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .settings-row input[type="text"] {
      width: 110px;
      padding: 7px 10px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      background: var(--surface-alt);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    .settings-row input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }

    .hint {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11.5px;
      color: var(--text-faint);
    }

    /* ── Input ── */
    textarea#mlfb-input {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      outline: none;
      background: var(--surface-alt);
      color: var(--text-primary);
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    textarea#mlfb-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 14px;
    }

    .btn {
      font-family: "Chakra Petch", sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 16px;
      border-radius: 5px;
      border: 1px solid;
      cursor: pointer;
      background: transparent;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn:active { transform: translateY(1px); }

    .btn-primary { background: var(--accent); border-color: color-mix(in srgb, var(--accent) 70%, #fff); color: #1a1206; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent); }

    .btn-secondary { color: #9fb0d0; border-color: #33415f; }
    .btn-secondary:hover { color: var(--text-primary); border-color: #53d8e8; box-shadow: 0 8px 20px rgba(83,216,232,.25); }

    .btn-danger { color: #ff9a9a; border-color: #6b3a4a; }
    .btn-danger:hover { color: #ff6b6b; border-color: #ff6b6b; }

    /* ── Output ── */
    .output-area {
      position: relative;
    }

    textarea#corrected-output {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      outline: none;
      background: var(--surface-alt);
      color: var(--text-primary);
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    textarea#corrected-output:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 6px 12px;
      font-family: "Chakra Petch", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--copy-bg);
      border: 1px solid var(--copy-bdr);
      border-radius: 5px;
      cursor: pointer;
      color: var(--copy-text);
      transition: all 0.15s;
    }

    .copy-btn:hover { background: var(--btn-sec-bg); color: var(--btn-sec-text); border-color: var(--btn-sec-bdr); }
    .copy-btn.copied { background: var(--copy-done-bg); color: var(--copy-done-text); border-color: var(--copy-done-bdr); }

    /* ── Report table ── */
    .table-wrap { overflow-x: auto; }

    table#report-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    table#report-table th, table#report-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    table#report-table td.wrap-cell { white-space: normal; max-width: 260px; }

    table#report-table th {
      background: var(--surface-alt);
      color: var(--text-muted);
      font-family: "Chakra Petch", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    table#report-table tr:hover td { background: var(--surface-alt); }

    .status-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 4px;
      font-family: "Chakra Petch", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .status-badge.ok {
      background: var(--status-ok-bg);
      color: var(--status-ok-text);
      border: 1px solid var(--status-ok-bdr);
    }

    .status-badge.warning {
      background: var(--status-warn-bg);
      color: var(--status-warn-text);
      border: 1px solid var(--status-warn-bdr);
    }

    .empty-note {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11.5px;
      color: var(--text-faint);
      padding: 6px 0;
    }

    @media (max-width: 640px) {
      .container { padding: 16px 12px 40px; }
      .card { padding: 16px; }
      textarea#mlfb-input { min-height: 160px; }
    }
  </style>
</head>
<body>

<script src="shared/header.js"></script>
<script>
  injectHeader({ icon: '<span style="font-size:1.3rem;">🏷️</span>', title: 'MLFB & Option Code Processor' });
</script>

<div class="container">

  <!-- Paste Input -->
  <div class="card">
    <h2 id="input-heading">Paste MLFB Data</h2>

    <div class="settings-row">
      <label for="segment-lengths" id="segment-label">MLFB segment lengths (excl. -Z):</label>
      <input type="text" id="segment-lengths" value="7,5,4" spellcheck="false" />
      <span class="hint" id="segment-hint">e.g. 7,5,4 → 6SL3700-1AH41-2AA3</span>
    </div>

    <textarea id="mlfb-input" spellcheck="false"
      placeholder="Paste tab-separated rows from Excel...&#10;&#10;Column 1: MLFB code&#10;Column 2 (optional): Option codes&#10;&#10;Example:&#10;6SL3700-1AH41-2AA3-Z	A01+B85+J84+P93"></textarea>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="convert()" id="btn-convert">🔄 Convert</button>
      <button class="btn btn-secondary" onclick="loadSample()" id="btn-sample">📋 Sample</button>
      <button class="btn btn-danger" onclick="clearAll()" id="btn-clear">🗑 Clear</button>
    </div>
  </div>

  <!-- Corrected Output -->
  <div class="card" id="output-card" style="display:none;">
    <h2 id="output-heading">Corrected Output</h2>
    <div class="output-area">
      <textarea id="corrected-output" readonly placeholder="Corrected, normalized rows will appear here..."></textarea>
      <button class="copy-btn" id="copy-btn" onclick="copyOutput()">📋 Copy</button>
    </div>
  </div>

  <!-- Validation Report -->
  <div class="card" id="report-card" style="display:none;">
    <h2 id="report-heading">Validation Report</h2>
    <div class="table-wrap" id="report-container"></div>
  </div>

</div>

<script>
  // ══════════════════════════════════════════════════
  // i18n (dark mode handled by shared/header.js)
  // ══════════════════════════════════════════════════
  const TRANSLATIONS = {
    en: {
      pageTitle: 'MLFB & Option Code Processor',
      inputHeading: 'Paste MLFB Data',
      segmentLabel: 'MLFB segment lengths (excl. -Z):',
      segmentHint: 'e.g. 7,5,4 → 6SL3700-1AH41-2AA3',
      inputPlaceholder: 'Paste tab-separated rows from Excel...\n\nColumn 1: MLFB code\nColumn 2 (optional): Option codes\n\nExample:\n6SL3700-1AH41-2AA3-Z\tA01+B85+J84+P93',
      btnConvert: '🔄 Convert',
      btnSample: '📋 Sample',
      btnClear: '🗑 Clear',
      outputHeading: 'Corrected Output',
      outputPlaceholder: 'Corrected, normalized rows will appear here...',
      copyBtn: '📋 Copy',
      copiedBtn: '✅ Copied',
      reportHeading: 'Validation Report',
      colRow: 'Row',
      colOrigMlfb: 'Original MLFB',
      colOrigOpt: 'Original Options',
      colCorrMlfb: 'Corrected MLFB',
      colCorrOpt: 'Corrected Options',
      colStatus: 'Status',
      colMessage: 'Message',
      statusOk: 'OK',
      statusWarning: 'Warning',
      emptyNote: 'No rows processed yet.',
      warnMlfbLength: 'MLFB core length mismatch: expected {expected} characters after removing separators, got {actual}. Row was not auto-corrected.',
      warnMlfbChars: 'MLFB contains non-alphanumeric characters after cleanup — please check manually.',
      warnOptLength: 'Option code length ({len}) is not a multiple of 3 — {leftover} trailing character(s) dropped.',
      warnOptInvalid: 'One or more option codes contain invalid characters.',
      warnEmptyMlfb: 'MLFB cell is empty — row skipped.',
      warnExtraCols: 'Row has more than 2 columns — extra columns were ignored.',
    },
    zh: {
      pageTitle: 'MLFB与选项代码处理工具',
      inputHeading: '粘贴 MLFB 数据',
      segmentLabel: 'MLFB 分段长度（不含 -Z）：',
      segmentHint: '例如 7,5,4 → 6SL3700-1AH41-2AA3',
      inputPlaceholder: '从 Excel 粘贴以 Tab 分隔的行...\n\n第1列：MLFB 代码\n第2列（可选）：选项代码\n\n示例：\n6SL3700-1AH41-2AA3-Z\tA01+B85+J84+P93',
      btnConvert: '🔄 转换',
      btnSample: '📋 示例',
      btnClear: '🗑 清除',
      outputHeading: '修正后的输出',
      outputPlaceholder: '修正并规范化后的行将显示在此处...',
      copyBtn: '📋 复制',
      copiedBtn: '✅ 已复制',
      reportHeading: '验证报告',
      colRow: '行',
      colOrigMlfb: '原始 MLFB',
      colOrigOpt: '原始选项',
      colCorrMlfb: '修正后 MLFB',
      colCorrOpt: '修正后选项',
      colStatus: '状态',
      colMessage: '消息',
      statusOk: '正常',
      statusWarning: '警告',
      emptyNote: '尚未处理任何行。',
      warnMlfbLength: 'MLFB 核心长度不匹配：去除分隔符后应为 {expected} 个字符，实际为 {actual} 个。该行未自动修正。',
      warnMlfbChars: '清理后 MLFB 包含非字母数字字符 — 请手动检查。',
      warnOptLength: '选项代码长度（{len}）不是 3 的倍数 — 丢弃了 {leftover} 个末尾字符。',
      warnOptInvalid: '一个或多个选项代码包含无效字符。',
      warnEmptyMlfb: 'MLFB 单元格为空 — 该行已跳过。',
      warnExtraCols: '该行超过 2 列 — 多余的列已被忽略。',
    }
  };

  function pageApplyTranslations() {
    document.title = currentLang === 'zh' ? 'MLFB与选项代码处理工具' : 'MLFB & Option Code Processor';

    document.getElementById('input-heading').textContent = t('inputHeading');
    document.getElementById('segment-label').textContent = t('segmentLabel');
    document.getElementById('segment-hint').textContent = t('segmentHint');
    document.getElementById('mlfb-input').placeholder = t('inputPlaceholder');
    document.getElementById('btn-convert').textContent = t('btnConvert');
    document.getElementById('btn-sample').textContent = t('btnSample');
    document.getElementById('btn-clear').textContent = t('btnClear');
    document.getElementById('output-heading').textContent = t('outputHeading');
    document.getElementById('corrected-output').placeholder = t('outputPlaceholder');
    document.getElementById('copy-btn').textContent = t('copyBtn');
    document.getElementById('report-heading').textContent = t('reportHeading');

    if (lastResults.length) {
      renderReport(lastResults);
    }
  }

  // ══════════════════════════════════════════════════
  // MLFB / Option Code Processing Logic
  // ══════════════════════════════════════════════════
  let lastResults = [];

  function getSegmentLengths() {
    const raw = document.getElementById('segment-lengths').value;
    const parts = raw.split(',')
      .map(s => parseInt(s.trim(), 10))
      .filter(n => !isNaN(n) && n > 0);
    return parts.length ? parts : [7, 5, 4];
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // Compare option codes: alphabetically first, then numerically.
  function compareCodes(a, b) {
    const parse = (c) => {
      const m = c.match(/^([A-Z]+)(\d+)$/i);
      if (m) return { alpha: m[1].toUpperCase(), num: parseInt(m[2], 10) };
      return { alpha: c.toUpperCase(), num: null };
    };
    const pa = parse(a), pb = parse(b);
    if (pa.alpha < pb.alpha) return -1;
    if (pa.alpha > pb.alpha) return 1;
    if (pa.num !== null && pb.num !== null) return pa.num - pb.num;
    return a.localeCompare(b);
  }

  function processMLFB(cell1, segmentLengths, totalLen) {
    let core = cell1.replace(/-/g, '').trim().toUpperCase();
    let warning = null;

    // Strip a trailing "Z" suffix marker (with or without preceding dash) if present.
    if (core.length === totalLen + 1 && core.slice(-1) === 'Z') {
      core = core.slice(0, -1);
    }

    if (core.length !== totalLen) {
      return {
        base: cell1.trim(),
        warning: { type: 'mlfbLength', expected: totalLen, actual: core.length }
      };
    }

    if (!/^[A-Z0-9]+$/.test(core)) {
      warning = { type: 'mlfbChars' };
    }

    const segs = [];
    let idx = 0;
    for (const len of segmentLengths) {
      segs.push(core.substr(idx, len));
      idx += len;
    }
    return { base: segs.join('-'), warning };
  }

  function processOptions(cell2) {
    const trimmed = cell2.trim();
    if (!trimmed) return { codes: [], warning: null };

    const raw = trimmed.replace(/\+/g, '').toUpperCase();
    let warning = null;
    const leftover = raw.length % 3;
    if (leftover !== 0) {
      warning = { type: 'optLength', len: raw.length, leftover: leftover };
    }

    const codes = [];
    for (let i = 0; i + 3 <= raw.length; i += 3) {
      codes.push(raw.substr(i, 3));
    }

    let invalidChars = false;
    codes.forEach(c => { if (!/^[A-Z0-9]{3}$/.test(c)) invalidChars = true; });
    if (invalidChars && !warning) warning = { type: 'optInvalid' };

    codes.sort(compareCodes);
    return { codes, warning };
  }

  function formatWarning(w) {
    if (!w) return '';
    const map = {
      mlfbLength: () => t('warnMlfbLength').replace('{expected}', w.expected).replace('{actual}', w.actual),
      mlfbChars: () => t('warnMlfbChars'),
      optLength: () => t('warnOptLength').replace('{len}', w.len).replace('{leftover}', w.leftover),
      optInvalid: () => t('warnOptInvalid'),
      emptyMlfb: () => t('warnEmptyMlfb'),
      extraCols: () => t('warnExtraCols'),
    };
    return map[w.type] ? map[w.type]() : '';
  }

  function convert() {
    const text = document.getElementById('mlfb-input').value;
    const lines = text.split('\n');
    const segmentLengths = getSegmentLengths();
    const totalLen = segmentLengths.reduce((a, b) => a + b, 0);
    const results = [];
    let rowNum = 0;

    lines.forEach((line) => {
      if (line.trim() === '') return;
      rowNum++;

      const cells = line.split('\t');
      const cell1 = (cells[0] || '').trim();
      const cell2 = (cells[1] || '').trim();
      const messages = [];

      if (cells.length > 2) {
        messages.push(formatWarning({ type: 'extraCols' }));
      }

      if (!cell1) {
        results.push({
          row: rowNum, origMlfb: cell1, origOpt: cell2,
          corrMlfb: '', corrOpt: '', status: 'warning',
          messages: [formatWarning({ type: 'emptyMlfb' })]
        });
        return;
      }

      const mlfbResult = processMLFB(cell1, segmentLengths, totalLen);
      const hasOptions = cell2 !== '';
      const optResult = hasOptions ? processOptions(cell2) : { codes: [], warning: null };

      const finalMlfb = mlfbResult.warning && mlfbResult.warning.type === 'mlfbLength'
        ? mlfbResult.base
        : mlfbResult.base + (hasOptions ? '-Z' : '');
      const finalOpt = optResult.codes.join('+');

      let status = 'ok';
      if (mlfbResult.warning) { status = 'warning'; messages.push(formatWarning(mlfbResult.warning)); }
      if (optResult.warning) { status = 'warning'; messages.push(formatWarning(optResult.warning)); }

      results.push({
        row: rowNum,
        origMlfb: cell1,
        origOpt: cell2,
        corrMlfb: finalMlfb,
        corrOpt: finalOpt,
        status,
        messages
      });
    });

    lastResults = results;
    renderOutput(results);
    renderReport(results);

    document.getElementById('output-card').style.display = results.length ? 'block' : 'none';
    document.getElementById('report-card').style.display = 'block';
  }

  function renderOutput(results) {
    const output = document.getElementById('corrected-output');
    output.value = results.map(r => r.corrMlfb + '\t' + r.corrOpt).join('\n');
  }

  function renderReport(results) {
    const container = document.getElementById('report-container');
    if (!results.length) {
      container.innerHTML = '<p class="empty-note">' + t('emptyNote') + '</p>';
      return;
    }

    let html = '<table id="report-table"><thead><tr>' +
      '<th>' + t('colRow') + '</th>' +
      '<th>' + t('colOrigMlfb') + '</th>' +
      '<th>' + t('colOrigOpt') + '</th>' +
      '<th>' + t('colCorrMlfb') + '</th>' +
      '<th>' + t('colCorrOpt') + '</th>' +
      '<th>' + t('colStatus') + '</th>' +
      '<th>' + t('colMessage') + '</th>' +
      '</tr></thead><tbody>';

    results.forEach(r => {
      const badgeClass = r.status === 'ok' ? 'ok' : 'warning';
      const badgeText = r.status === 'ok' ? t('statusOk') : t('statusWarning');
      html += '<tr>' +
        '<td>' + r.row + '</td>' +
        '<td>' + escapeHtml(r.origMlfb) + '</td>' +
        '<td>' + escapeHtml(r.origOpt) + '</td>' +
        '<td>' + escapeHtml(r.corrMlfb) + '</td>' +
        '<td>' + escapeHtml(r.corrOpt) + '</td>' +
        '<td><span class="status-badge ' + badgeClass + '">' + badgeText + '</span></td>' +
        '<td class="wrap-cell">' + r.messages.map(escapeHtml).join('<br>') + '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  // ── Copy ──
  async function copyOutput() {
    const output = document.getElementById('corrected-output');
    if (!output.value.trim()) return;

    try {
      await navigator.clipboard.writeText(output.value);
      const btn = document.getElementById('copy-btn');
      btn.textContent = t('copiedBtn');
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = t('copyBtn');
        btn.classList.remove('copied');
      }, 2000);
    } catch {
      output.select();
      document.execCommand('copy');
    }
  }

  // ── Sample ──
  function loadSample() {
    document.getElementById('mlfb-input').value =
`6SL3700-1AH41-2AA3-Z\tA01+B85+J84+P93
6SL37001AH412AA3Z\tA01+B85+J84+P93
