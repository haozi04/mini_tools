<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Tools</title>
  <meta name="description" content="A collection of lightweight, browser-based utility tools." />
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/header.css" />
  <style>
    :root {
      --card-border:   transparent;
      --card-hover:   #d98a1f;
      --footer-bg:    #ffffff;
      --footer-border: #d5dce8;
    }

    [data-theme="dark"] {
      --card-border:   #263353;
      --card-hover:   #ffb454;
      --footer-bg:    #121a2c;
      --footer-border: #263353;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ── Index-specific header (centered, larger) ── */
    header {
      padding: 40px 24px 36px;
      text-align: center;
      box-shadow: none;
      border-bottom: 1px solid var(--border);
    }

    .header-actions {
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .switcher-btn { padding: 8px 14px; font-size: 0.85rem; }
    .dark-toggle  { width: 36px; height: 34px; font-size: 1rem; }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.85;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: transparent;
      color: var(--text-primary);
      padding: 40px 24px 36px;
      text-align: center;
      box-shadow: none;
    }

    .header-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .switcher {
      display: flex;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--switcher-bdr);
    }

    .switcher-btn {
      padding: 8px 14px;
      border: none;
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-family: "Chakra Petch", sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }

    .switcher-btn + .switcher-btn {
      border-left: 1px solid var(--switcher-bdr);
    }

    .switcher-btn.active {
      background: var(--switcher-act-bg);
      color: var(--switcher-act-txt);
    }

    .switcher-btn:hover:not(.active) {
      background: var(--switcher-hover);
    }

    .dark-toggle {
      width: 36px;
      height: 34px;
      border-radius: 5px;
      border: 1px solid var(--switcher-bdr);
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .dark-toggle:hover { background: var(--switcher-hover); }

    header h1 {
      font-family: "Chakra Petch", sans-serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    header p {
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 1rem;
      opacity: 0.85;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ── Tool Grid ───────────────────────────────────────────── */
    .tools-section {
      position: relative;
      z-index: 1;
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .tools-section h2 {
      font-family: "Chakra Petch", sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-faint);
      margin-bottom: 24px;
      font-weight: 600;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .tool-group { margin-bottom: 36px; }

    .group-heading {
      font-family: "Chakra Petch", sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 16px;
      font-weight: 600;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .tool-card {
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 14px 34px var(--shadow);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow);
      border-color: var(--card-hover);
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }

    .tool-card h3 {
      font-family: "Chakra Petch", sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tool-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .tool-card.markdown .tool-icon { background: var(--surface-alt); color: var(--accent); }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 0.78rem;
      color: var(--text-faint);
      border-top: 1px solid var(--footer-border);
      background: var(--footer-bg);
      transition: background 0.3s, color 0.3s;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Mobile ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 28px 16px 24px; }
      header h1 { font-size: 1.5rem; }
      header p { font-size: 0.9rem; }
      .tools-section { padding: 28px 14px 40px; }
      .tool-grid { grid-template-columns: 1fr; gap: 14px; }
      .tool-card { padding: 20px 18px; }
    }
  </style>
</head>
<body>

<header>
  <h1 id="page-title">🧰 Mini Tools</h1>
  <p id="page-intro">A collection of lightweight, browser-based utility tools. No sign-up, no tracking — just open and use.</p>
  <div class="header-actions">
    <div class="switcher">
      <button class="switcher-btn" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="switcher-btn" id="btn-zh" onclick="setLang('zh')">中文</button>
    </div>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
  </div>
</header>

<main class="tools-section">

  <div class="tool-group">
    <h3 class="group-heading" id="group-misc">Misc</h3>
    <div class="tool-grid" id="grid-misc"></div>
  </div>

  <div class="tool-group">
    <h3 class="group-heading" id="group-siemens">Siemens</h3>
    <div class="tool-grid" id="grid-siemens"></div>
  </div>

  <div class="tool-group">
    <h3 class="group-heading" id="group-3d">3D PRINT</h3>
    <div class="tool-grid" id="grid-3d"></div>
  </div>
</main>

<footer>
  <p><span id="footer-text">Mini Tools &copy; 2026 &mdash; Built for simplicity.</span></p>
</footer>

<script src="shared/header.js"></script>
<script>
  // ══════════════════════════════════════════════════
  // i18n (dark mode handled by shared/header.js)
  // ══════════════════════════════════════════════════
  const TRANSLATIONS = {
    en: {
      metaDescription: 'A collection of lightweight, browser-based utility tools.',
      pageTitle: '🧰 Mini Tools',
      pageIntro: 'A collection of lightweight, browser-based utility tools. No sign-up, no tracking — just open and use.',
      groupSiemens: 'Siemens',
      group3d: '3D PRINT',
      groupMisc: 'Misc',
      markdownTitle: 'Markdown Renderer',
      markdownDesc: 'Write Markdown with live preview. Supports LaTeX math, code blocks, tables, and more. Export to HTML or PDF.',
      warrantyTitle: 'FID Toolkit',
      warrantyDesc: 'Decode and validate Siemens FID numbers. Extract FIDs from text, check warranty status, and export results.',
      formatTitle: 'Format Converter',
      formatDesc: 'Convert pasted content among Excel (tab-delimited), CSV, and Markdown table formats.',
      mapTitle: 'Map Wallpaper Studio',
      mapDesc: 'Generate city map wallpapers from OpenStreetMap data. Customize size, colors, and road density, then export as PNG, JPG, SVG, PDF, or EPS.',
      converter3dTitle: '3MF / STL Converter',
      converter3dDesc: 'Convert 3D model files between 3MF and STL formats entirely in your browser.',
      mlfbTitle: 'MLFB & Option Code Processor',
      mlfbDesc: 'Paste Excel data with MLFB codes and option codes, validate and normalize them for PMD.',
      bboxTitle: 'bbox·lab',
      bboxDesc: 'Project normalized 0–1000 bounding boxes onto real image pixels as an interactive overlay.',
      chunkerTitle: 'Text Chunker and Counter',
      chunkerDesc: 'Count characters and estimate tokens, then split long text into model-window-sized chunks with prompt prefixes.',
      workdayTitle: 'Workday Calculator',
      workdayDesc: 'Calculate delivery dates and workdays, excluding weekends and holidays. Forward and backward calculations.',
      footerText: 'Mini Tools © 2026 — Built for simplicity.',
    },
    zh: {
      metaDescription: '一组轻量级、基于浏览器的实用工具集合。',
      pageTitle: '🧰 迷你工具箱',
      pageIntro: '一组轻量级、基于浏览器的实用工具集合。无需注册、无需跟踪 —— 直接打开即可使用。',
      groupSiemens: '西门子',
      group3d: '3D 打印',
      groupMisc: '其他',
      markdownTitle: 'Markdown 渲染器',
      markdownDesc: '使用实时预览编写 Markdown。支持 LaTeX 数学公式、代码块、表格等内容。可导出为 HTML 或 PDF。',
      warrantyTitle: 'FID 工具包',
      warrantyDesc: '解码并验证 Siemens FID 编号。从文本中提取 FID，检查保修状态，并导出结果。',
      formatTitle: '格式转换器',
      formatDesc: '在 Excel（制表符分隔）、CSV 和 Markdown 表格格式之间转换粘贴的内容。',
      mapTitle: '地图壁纸工作室',
      mapDesc: '从 OpenStreetMap 数据生成城市地图壁纸。自定义尺寸、颜色和道路密度，导出为 PNG、JPG、SVG、PDF 或 EPS。',
      converter3dTitle: '3MF / STL 转换器',
      converter3dDesc: '在浏览器中完全转换 3MF 和 STL 格式的 3D 模型文件。',
      mlfbTitle: 'MLFB 与选型代码处理器',
      mlfbDesc: '粘贴包含 MLFB 编码和选型代码的 Excel 数据，验证并规范化为 PMD 格式。',
      bboxTitle: 'bbox·lab',
      bboxDesc: '将归一化的 0–1000 边界框投影到真实图像像素上，作为交互式叠加层。',
      chunkerTitle: '长文本分段与 Token 预估器',
      chunkerDesc: '统计字符数并估算 Token，然后在自然段落边界处将长文本按模型窗口大小切分，并自动添加 Prompt 前缀。',
      workdayTitle: '工作日 / 交货期计算器',
      workdayDesc: '计算交货日期和工作日，排除周末和节假日。支持正向与反向推算。',
      footerText: 'Mini Tools © 2026 — 以简洁为核心。',
    }
  };

  function pageApplyTranslations() {
    document.title = currentLang === 'zh' ? '迷你工具箱' : 'Mini Tools';

    const metaDescription = document.querySelector('meta[name="description"]');
    if (metaDescription) {
      metaDescription.setAttribute('content', t('metaDescription'));
    }

    const setText = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.textContent = t(key);
    };

    setText('page-title', 'pageTitle');
    setText('page-intro', 'pageIntro');
    setText('group-siemens', 'groupSiemens');
    setText('group-3d', 'group3d');
    setText('group-misc', 'groupMisc');
    setText('markdown-title', 'markdownTitle');
    setText('markdown-desc', 'markdownDesc');
    setText('warranty-title', 'warrantyTitle');
    setText('warranty-desc', 'warrantyDesc');
    setText('format-title', 'formatTitle');
    setText('format-desc', 'formatDesc');
    setText('map-title', 'mapTitle');
    setText('map-desc', 'mapDesc');
    setText('converter3d-title', 'converter3dTitle');
    setText('converter3d-desc', 'converter3dDesc');
    setText('mlfb-title', 'mlfbTitle');
    setText('mlfb-desc', 'mlfbDesc');
    setText('bbox-title', 'bboxTitle');
    setText('bbox-desc', 'bboxDesc');
    setText('chunker-title', 'chunkerTitle');
    setText('chunker-desc', 'chunkerDesc');
    setText('workday-title', 'workdayTitle');
    setText('workday-desc', 'workdayDesc');
    setText('footer-text', 'footerText');
  }

  // ══════════════════════════════════════════════════
  // TOOL CARDS — Rendering
  // ══════════════════════════════════════════════════
  const TOOL_CARDS = [
    { href: 'warranty-tool.html',     icon: '🔧',   id: 'warranty', group: 'siemens', titleKey: 'warrantyTitle', descKey: 'warrantyDesc' },
    { href: 'mlfb-option-code-processor.html', icon: '⚙️', id: 'mlfb', group: 'siemens', titleKey: 'mlfbTitle', descKey: 'mlfbDesc' },
    { href: 'markdown-renderer.html', icon: 'M↓',   id: 'markdown', group: 'misc', titleKey: 'markdownTitle', descKey: 'markdownDesc' },
    { href: 'format-converter.html',  icon: '🔁',   id: 'format',   group: 'misc', titleKey: 'formatTitle',   descKey: 'formatDesc', },
    { href: 'city-map-wallpaper.html', icon: '🗺️',   id: 'map',      group: 'misc', titleKey: 'mapTitle',      descKey: 'mapDesc' },
    { href: '3mf-stl-converter.html', icon: '🧊',   id: 'converter3d', group: '3d', titleKey: 'converter3dTitle', descKey: 'converter3dDesc' },
    { href: 'bbox-tool.html',         icon: '▭',   id: 'bbox',       group: 'misc', titleKey: 'bboxTitle',      descKey: 'bboxDesc' },
    { href: 'text-chunker.html',      icon: '✂️',   id: 'chunker',    group: 'misc', titleKey: 'chunkerTitle',   descKey: 'chunkerDesc' },
    { href: 'workday-calculator.html', icon: '🗓️',   id: 'workday',    group: 'misc', titleKey: 'workdayTitle',   descKey: 'workdayDesc' },
  ];

  function renderCards() {
    const gridSiemens = document.getElementById('grid-siemens');
    const grid3d      = document.getElementById('grid-3d');
    const gridMisc    = document.getElementById('grid-misc');
    gridSiemens.innerHTML = '';
    grid3d.innerHTML = '';
    gridMisc.innerHTML = '';

    TOOL_CARDS.forEach(card => {
      const a = document.createElement('a');
      a.href = card.href;
      a.className = 'tool-card markdown';
      a.innerHTML = `
        <div class="tool-icon">${card.icon}</div>
        <h3 id="${card.id}-title">${t(card.titleKey)}</h3>
        <p id="${card.id}-desc">${t(card.descKey)}</p>
      `;

      const targetGrid = card.group === 'siemens' ? gridSiemens
                      : card.group === '3d' ? grid3d
                      : gridMisc;
      targetGrid.appendChild(a);
    });

    // Re-apply translations for the new elements
    applyTranslations();
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderCards();
  });
</script>

</body>
</html>
