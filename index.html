<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Tools</title>
  <meta name="description" content="A collection of lightweight, browser-based utility tools." />
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/header.css" />
  <style>
    :root {
      --card-border:   transparent;
      --card-hover:    #009999;
      --footer-bg:     #ffffff;
      --footer-border: #e0e0e0;
    }

    [data-theme="dark"] {
      --card-border:   #2a2d3e;
      --card-hover:    #00cccc;
      --footer-bg:     #1a1d27;
      --footer-border: #2a2d3e;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ── Index-specific header (centered, larger) ── */
    header {
      padding: 40px 24px 36px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .header-actions {
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .switcher-btn { padding: 8px 14px; font-size: 0.85rem; }
    .dark-toggle  { width: 36px; height: 34px; font-size: 1rem; }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.85;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      padding: 40px 24px 36px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .header-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .switcher {
      display: flex;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--switcher-bdr);
    }

    .switcher-btn {
      padding: 8px 14px;
      border: none;
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }

    .switcher-btn + .switcher-btn {
      border-left: 1px solid var(--switcher-bdr);
    }

    .switcher-btn.active {
      background: var(--switcher-act-bg);
      color: var(--switcher-act-txt);
    }

    .switcher-btn:hover:not(.active) {
      background: var(--switcher-hover);
    }

    .dark-toggle {
      width: 36px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--switcher-bdr);
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .dark-toggle:hover { background: var(--switcher-hover); }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.85;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ── Tool Grid ───────────────────────────────────────────── */
    .tools-section {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .tools-section h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
      margin-bottom: 24px;
      font-weight: 600;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .tool-group { margin-bottom: 36px; }

    .group-heading {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 16px;
      font-weight: 700;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--accent-light);
    }

    .tool-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px var(--shadow);
      border: 2px solid var(--card-border);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow);
      border-color: var(--card-hover);
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .tool-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tool-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .tool-card.markdown .tool-icon { background: var(--accent-light); color: var(--accent); }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 0.78rem;
      color: var(--text-faint);
      border-top: 1px solid var(--footer-border);
      background: var(--footer-bg);
      transition: background 0.3s, color 0.3s;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Mobile ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 28px 16px 24px; }
      header h1 { font-size: 1.5rem; }
      header p { font-size: 0.9rem; }
      .tools-section { padding: 28px 14px 40px; }
      .tool-grid { grid-template-columns: 1fr; gap: 14px; }
      .tool-card { padding: 20px 18px; }
    }
  </style>
</head>
<body>

<header>
  <h1 id="page-title">🧰 Mini Tools</h1>
  <p id="page-intro">A collection of lightweight, browser-based utility tools. No sign-up, no tracking — just open and use.</p>
  <div class="header-actions">
    <div class="switcher">
      <button class="switcher-btn" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="switcher-btn" id="btn-zh" onclick="setLang('zh')">中文</button>
    </div>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
  </div>
</header>

<main class="tools-section">
  <h2 id="tools-heading">Available Tools</h2>

  <div class="tool-group">
    <h3 class="group-heading" id="group-siemens">Siemens</h3>
    <div class="tool-grid" id="grid-siemens"></div>
  </div>

  <div class="tool-group">
    <h3 class="group-heading" id="group-misc">Misc</h3>
    <div class="tool-grid" id="grid-misc"></div>
  </div>
</main>

<footer>
  <p><span id="footer-text">Mini Tools &copy; 2026 &mdash; Built for simplicity.</span> <a id="footer-source" href="https://github.com">Source</a></p>
</footer>

<script src="shared/header.js"></script>
<script>
  // ══════════════════════════════════════════════════
  // i18n (dark mode handled by shared/header.js)
  // ══════════════════════════════════════════════════
  const TRANSLATIONS = {
    en: {
      metaDescription: 'A collection of lightweight, browser-based utility tools.',
      pageTitle: '🧰 Mini Tools',
      pageIntro: 'A collection of lightweight, browser-based utility tools. No sign-up, no tracking — just open and use.',
      toolsHeading: 'Available Tools',
      groupSiemens: 'Siemens',
      groupMisc: 'Misc',
      markdownTitle: 'Markdown Renderer',
      markdownDesc: 'Write Markdown with live preview. Supports LaTeX math, code blocks, tables, and more. Export to HTML or PDF.',
      warrantyTitle: 'FID Toolkit',
      warrantyDesc: 'Decode and validate Siemens FID numbers. Extract FIDs from text, check warranty status, and export results.',
      excelTitle: 'Excel to Markdown',
      excelDesc: 'Paste Excel data and convert to clean Markdown tables. Preview and copy with one click.',
      mlfbTitle: 'MLFB & Option Code Processor',
      mlfbDesc: 'Paste Excel data with MLFB codes and option codes, validate and normalize them for PMD.',
      footerText: 'Mini Tools © 2026 — Built for simplicity.',
      footerSource: 'Source',
    },
    zh: {
      metaDescription: '一组轻量级、基于浏览器的实用工具集合。',
      pageTitle: '🧰 迷你工具箱',
      pageIntro: '一组轻量级、基于浏览器的实用工具集合。无需注册、无需跟踪 —— 直接打开即可使用。',
      toolsHeading: '可用工具',
      groupSiemens: '西门子',
      groupMisc: '其他',
      markdownTitle: 'Markdown 渲染器',
      markdownDesc: '使用实时预览编写 Markdown。支持 LaTeX 数学公式、代码块、表格等内容。可导出为 HTML 或 PDF。',
      warrantyTitle: 'FID 工具包',
      warrantyDesc: '解码并验证 Siemens FID 编号。从文本中提取 FID，检查保修状态，并导出结果。',
      excelTitle: 'Excel 转 Markdown',
      excelDesc: '将 Excel 数据粘贴并转换为干净的 Markdown 表格。预览并一键复制。',
      mlfbTitle: 'MLFB 与选型代码处理器',
      mlfbDesc: '粘贴包含 MLFB 编码和选型代码的 Excel 数据，验证并规范化为 PMD 格式。',
      footerText: 'Mini Tools © 2026 — 以简洁为核心。',
      footerSource: '源码',
    }
  };

  function pageApplyTranslations() {
    document.title = currentLang === 'zh' ? '迷你工具箱' : 'Mini Tools';

    const metaDescription = document.querySelector('meta[name="description"]');
    if (metaDescription) {
      metaDescription.setAttribute('content', t('metaDescription'));
    }

    const setText = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.textContent = t(key);
    };

    setText('page-title', 'pageTitle');
    setText('page-intro', 'pageIntro');
    setText('tools-heading', 'toolsHeading');
    setText('group-siemens', 'groupSiemens');
    setText('group-misc', 'groupMisc');
    setText('markdown-title', 'markdownTitle');
    setText('markdown-desc', 'markdownDesc');
    setText('warranty-title', 'warrantyTitle');
    setText('warranty-desc', 'warrantyDesc');
    setText('excel-title', 'excelTitle');
    setText('excel-desc', 'excelDesc');
    setText('mlfb-title', 'mlfbTitle');
    setText('mlfb-desc', 'mlfbDesc');
    setText('footer-text', 'footerText');
    setText('footer-source', 'footerSource');
  }

  // ══════════════════════════════════════════════════
  // TOOL CARDS — Rendering
  // ══════════════════════════════════════════════════
  const TOOL_CARDS = [
    { href: 'warranty-tool.html',     icon: '🔧',   id: 'warranty', group: 'siemens', titleKey: 'warrantyTitle', descKey: 'warrantyDesc' },
    { href: 'mlfb-option-code-processor.html', icon: '⚙️', id: 'mlfb', group: 'siemens', titleKey: 'mlfbTitle', descKey: 'mlfbDesc' },
    { href: 'markdown-renderer.html', icon: 'M↓',   id: 'markdown', group: 'misc', titleKey: 'markdownTitle', descKey: 'markdownDesc' },
    { href: 'excel-to-markdown.html', icon: '📊',   id: 'excel',    group: 'misc', titleKey: 'excelTitle',    descKey: 'excelDesc' },
  ];

  function renderCards() {
    const gridSiemens = document.getElementById('grid-siemens');
    const gridMisc    = document.getElementById('grid-misc');
    gridSiemens.innerHTML = '';
    gridMisc.innerHTML = '';

    TOOL_CARDS.forEach(card => {
      const a = document.createElement('a');
      a.href = card.href;
      a.className = 'tool-card markdown';
      a.innerHTML = `
        <div class="tool-icon">${card.icon}</div>
        <h3 id="${card.id}-title">${t(card.titleKey)}</h3>
        <p id="${card.id}-desc">${t(card.descKey)}</p>
      `;

      const targetGrid = card.group === 'siemens' ? gridSiemens : gridMisc;
      targetGrid.appendChild(a);
    });

    // Re-apply translations for the new elements
    applyTranslations();
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderCards();
  });
</script>

</body>
</html>
