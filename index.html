<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Tools</title>
  <meta name="description" content="A collection of lightweight, browser-based utility tools." />
  <style>
    /* ══════════════════════════════════════════════
       CSS CUSTOM PROPERTIES — Light (default)
       ══════════════════════════════════════════════ */
    :root {
      --bg:            #f0f2f5;
      --surface:       #ffffff;
      --surface-alt:   #f7fafa;
      --border:        #e0eeee;
      --text-primary:  #1a1a2e;
      --text-muted:    #666666;
      --text-faint:    #aaaaaa;
      --accent:        #009999;
      --accent-dark:   #007a7a;
      --accent-light:  #e0f5f5;
      --shadow:        rgba(0,0,0,0.08);
      --card-border:   transparent;
      --card-hover:    #009999;
      --footer-bg:     #ffffff;
      --footer-border: #e0e0e0;
      --switcher-bg:      rgba(255,255,255,0.16);
      --switcher-text:    #ffffff;
      --switcher-bdr:     rgba(255,255,255,0.35);
      --switcher-hover:   rgba(255,255,255,0.24);
      --switcher-act-bg:  #ffffff;
      --switcher-act-txt: #009999;
    }

    /* ══════════════════════════════════════════════
       DARK MODE OVERRIDES
       ══════════════════════════════════════════════ */
    [data-theme="dark"] {
      --bg:            #0f1117;
      --surface:       #1a1d27;
      --surface-alt:   #1e2130;
      --border:        #2a2d3e;
      --text-primary:  #e2e8f0;
      --text-muted:    #94a3b8;
      --text-faint:    #4a5568;
      --accent:        #00cccc;
      --accent-dark:   #00aaaa;
      --accent-light:  #0d2e2e;
      --shadow:        rgba(0,0,0,0.4);
      --card-border:   #2a2d3e;
      --card-hover:    #00cccc;
      --footer-bg:     #1a1d27;
      --footer-border: #2a2d3e;
      --switcher-bg:      rgba(255,255,255,0.10);
      --switcher-text:    #e2e8f0;
      --switcher-bdr:     rgba(255,255,255,0.25);
      --switcher-hover:   rgba(255,255,255,0.18);
      --switcher-act-bg:  #00cccc;
      --switcher-act-txt: #0f1117;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      padding: 40px 24px 36px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .header-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .switcher {
      display: flex;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--switcher-bdr);
    }

    .switcher-btn {
      padding: 8px 14px;
      border: none;
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }

    .switcher-btn + .switcher-btn {
      border-left: 1px solid var(--switcher-bdr);
    }

    .switcher-btn.active {
      background: var(--switcher-act-bg);
      color: var(--switcher-act-txt);
    }

    .switcher-btn:hover:not(.active) {
      background: var(--switcher-hover);
    }

    .dark-toggle {
      width: 36px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--switcher-bdr);
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .dark-toggle:hover { background: var(--switcher-hover); }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.85;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ── Tool Grid ───────────────────────────────────────────── */
    .tools-section {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .tools-section h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
      margin-bottom: 24px;
      font-weight: 600;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .tool-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px var(--shadow);
      border: 2px solid var(--card-border);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow);
      border-color: var(--card-hover);
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .tool-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tool-card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .tool-card.markdown .tool-icon { background: var(--accent-light); color: var(--accent); }

    /* ── Drag & Drop ─────────────────────────────────────────── */
    .tool-card.dragging {
      opacity: 0.4;
      transform: scale(0.96);
    }

    .tool-card.drag-over {
      border-color: var(--accent);
      border-style: dashed;
      transform: scale(1.02);
      box-shadow: 0 4px 16px var(--shadow);
    }

    .tool-card {
      cursor: grab;
    }

    .tool-card:active {
      cursor: grabbing;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 0.78rem;
      color: var(--text-faint);
      border-top: 1px solid var(--footer-border);
      background: var(--footer-bg);
      transition: background 0.3s, color 0.3s;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Mobile ──────────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 28px 16px 24px; }
      header h1 { font-size: 1.5rem; }
      header p { font-size: 0.9rem; }
      .tools-section { padding: 28px 14px 40px; }
      .tool-grid { grid-template-columns: 1fr; gap: 14px; }
      .tool-card { padding: 20px 18px; }
    }
  </style>
</head>
<body>

<header>
  <h1 id="page-title">🧰 Mini Tools</h1>
  <p id="page-intro">A collection of lightweight, browser-based utility tools. No sign-up, no tracking — just open and use.</p>
  <div class="header-actions">
    <div class="switcher">
      <button class="switcher-btn" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="switcher-btn" id="btn-zh" onclick="setLang('zh')">中文</button>
    </div>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
  </div>
</header>

<main class="tools-section">
  <h2 id="tools-heading">Available Tools</h2>

  <div class="tool-grid">

    <!-- Cards are rendered by JS for drag-and-drop support -->

  </div>
</main>

<footer>
  <p><span id="footer-text">Mini Tools &copy; 2026 &mdash; Built for simplicity.</span> <a id="footer-source" href="https://github.com">Source</a></p>
</footer>

<script>
  // ══════════════════════════════════════════════════
  // DARK MODE
  // ══════════════════════════════════════════════════
  const DARK_KEY = 'miniToolsDark';

  function getInitialTheme() {
    const saved = localStorage.getItem(DARK_KEY);
    if (saved !== null) return saved === 'true';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  let isDark = getInitialTheme();

  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const btn = document.getElementById('darkToggle');
    btn.textContent = dark ? '☀️' : '🌙';
    btn.title = dark
      ? (currentLang === 'zh' ? '切换到浅色模式' : 'Switch to light mode')
      : (currentLang === 'zh' ? '切换到深色模式' : 'Switch to dark mode');
  }

  function toggleDark() {
    isDark = !isDark;
    localStorage.setItem(DARK_KEY, isDark);
    applyTheme(isDark);
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (localStorage.getItem(DARK_KEY) === null) {
      isDark = e.matches;
      applyTheme(isDark);
    }
  });

  // ══════════════════════════════════════════════════
  // i18n
  // ══════════════════════════════════════════════════
  const TRANSLATIONS = {
    en: {
      metaDescription: 'A collection of lightweight, browser-based utility tools.',
      pageTitle: '🧰 Mini Tools',
      pageIntro: 'A collection of lightweight, browser-based utility tools. No sign-up, no tracking — just open and use.',
      toolsHeading: 'Available Tools',
      markdownTitle: 'Markdown Renderer',
      markdownDesc: 'Write Markdown with live preview. Supports LaTeX math, code blocks, tables, and more. Export to HTML or PDF.',
      warrantyTitle: 'FID Toolkit',
      warrantyDesc: 'Decode and validate Siemens FID numbers. Extract FIDs from text, check warranty status, and export results.',
      excelTitle: 'Excel to Markdown',
      excelDesc: 'Paste Excel data and convert to clean Markdown tables. Preview and copy with one click.',
      footerText: 'Mini Tools © 2026 — Built for simplicity.',
      footerSource: 'Source',
      dark_on: 'Switch to light mode',
      dark_off: 'Switch to dark mode',
    },
    zh: {
      metaDescription: '一组轻量级、基于浏览器的实用工具集合。',
      pageTitle: '🧰 迷你工具箱',
      pageIntro: '一组轻量级、基于浏览器的实用工具集合。无需注册、无需跟踪 —— 直接打开即可使用。',
      toolsHeading: '可用工具',
      markdownTitle: 'Markdown 渲染器',
      markdownDesc: '使用实时预览编写 Markdown。支持 LaTeX 数学公式、代码块、表格等内容。可导出为 HTML 或 PDF。',
      warrantyTitle: 'FID 工具包',
      warrantyDesc: '解码并验证 Siemens FID 编号。从文本中提取 FID，检查保修状态，并导出结果。',
      excelTitle: 'Excel 转 Markdown',
      excelDesc: '将 Excel 数据粘贴并转换为干净的 Markdown 表格。预览并一键复制。',
      footerText: 'Mini Tools © 2026 — 以简洁为核心。',
      footerSource: '源码',
      dark_on: '切换到浅色模式',
      dark_off: '切换到深色模式',
    }
  };

  let currentLang = (navigator.language || navigator.userLanguage || 'en')
                      .toLowerCase().startsWith('zh') ? 'zh' : 'en';

  function t(key) {
    return TRANSLATIONS[currentLang][key] || TRANSLATIONS['en'][key] || key;
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    document.title = currentLang === 'zh' ? '迷你工具箱' : 'Mini Tools';

    const metaDescription = document.querySelector('meta[name="description"]');
    if (metaDescription) {
      metaDescription.setAttribute('content', t('metaDescription'));
    }

    document.getElementById('page-title').textContent = t('pageTitle');
    document.getElementById('page-intro').textContent = t('pageIntro');
    document.getElementById('tools-heading').textContent = t('toolsHeading');
    document.getElementById('markdown-title').textContent = t('markdownTitle');
    document.getElementById('markdown-desc').textContent = t('markdownDesc');
    document.getElementById('warranty-title').textContent = t('warrantyTitle');
    document.getElementById('warranty-desc').textContent = t('warrantyDesc');
    document.getElementById('excel-title').textContent = t('excelTitle');
    document.getElementById('excel-desc').textContent = t('excelDesc');
    document.getElementById('footer-text').textContent = t('footerText');
    document.getElementById('footer-source').textContent = t('footerSource');

    document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
    document.getElementById('btn-zh').classList.toggle('active', currentLang === 'zh');
    applyTheme(isDark);
  }

  function setLang(lang) {
    currentLang = lang;
    applyTranslations();
  }

  // ══════════════════════════════════════════════════
  // DRAG & DROP — Tile Reordering
  // ══════════════════════════════════════════════════
  const ORDER_KEY = 'miniToolsOrder';

  const TOOL_CARDS = [
    { href: 'markdown-renderer.html', icon: 'M↓',   id: 'markdown', titleKey: 'markdownTitle', descKey: 'markdownDesc' },
    { href: 'warranty-tool.html',     icon: '🔧',   id: 'warranty', titleKey: 'warrantyTitle', descKey: 'warrantyDesc' },
    { href: 'excel-to-markdown.html', icon: '📊',   id: 'excel',    titleKey: 'excelTitle',    descKey: 'excelDesc' },
  ];

  function renderCards() {
    const saved = localStorage.getItem(ORDER_KEY);
    let order;
    if (saved) {
      try {
        order = JSON.parse(saved);
        // Ensure all known ids are present
        const allIds = TOOL_CARDS.map(c => c.id);
        for (const id of allIds) {
          if (!order.includes(id)) order.push(id);
        }
        // Remove any stale ids
        order = order.filter(id => allIds.includes(id));
      } catch {
        order = TOOL_CARDS.map(c => c.id);
      }
    } else {
      order = TOOL_CARDS.map(c => c.id);
    }

    const grid = document.querySelector('.tool-grid');
    grid.innerHTML = '';

    const byId = {};
    TOOL_CARDS.forEach(c => { byId[c.id] = c; });

    order.forEach(id => {
      const card = byId[id];
      if (!card) return;
      const a = document.createElement('a');
      a.href = card.href;
      a.className = 'tool-card markdown';
      a.draggable = true;
      a.dataset.cardId = card.id;
      a.innerHTML = `
        <div class="tool-icon">${card.icon}</div>
        <h3 id="${card.id}-title">${t(card.titleKey)}</h3>
        <p id="${card.id}-desc">${t(card.descKey)}</p>
      `;

      a.addEventListener('dragstart', onDragStart);
      a.addEventListener('dragend', onDragEnd);
      a.addEventListener('dragover', onDragOver);
      a.addEventListener('dragenter', onDragEnter);
      a.addEventListener('dragleave', onDragLeave);
      a.addEventListener('drop', onDrop);

      grid.appendChild(a);
    });

    // Re-apply translations for the new elements
    applyTranslations();
  }

  let dragSrcId = null;

  function onDragStart(e) {
    dragSrcId = this.dataset.cardId;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragSrcId);
  }

  function onDragEnd(e) {
    this.classList.remove('dragging');
    document.querySelectorAll('.tool-card.drag-over').forEach(el => el.classList.remove('drag-over'));
  }

  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }

  function onDragEnter(e) {
    e.preventDefault();
    if (this.dataset.cardId !== dragSrcId) {
      this.classList.add('drag-over');
    }
  }

  function onDragLeave(e) {
    this.classList.remove('drag-over');
  }

  function onDrop(e) {
    e.preventDefault();
    this.classList.remove('drag-over');

    const targetId = this.dataset.cardId;
    if (!dragSrcId || dragSrcId === targetId) return;

    const saved = localStorage.getItem(ORDER_KEY);
    let order = saved ? JSON.parse(saved) : TOOL_CARDS.map(c => c.id);

    const srcIdx = order.indexOf(dragSrcId);
    const tgtIdx = order.indexOf(targetId);
    if (srcIdx === -1 || tgtIdx === -1) return;

    // Remove source and re-insert at target position
    order.splice(srcIdx, 1);
    const newTgtIdx = order.indexOf(targetId);
    order.splice(newTgtIdx, 0, dragSrcId);

    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
    renderCards();
  }

  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(isDark);
    renderCards();
  });
</script>

</body>
</html>
