<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Excel to Markdown</title>
  <meta name="description" content="Paste Excel data and convert to clean Markdown tables." />
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/header.css" />
  <style>
    :root {
      --border-input:  #cce8e8;
      --btn-sec-bg:    #e0f5f5;
      --btn-sec-text:  #007777;
      --btn-sec-bdr:   #b2e0e0;
      --btn-sec-hover: #c5ecec;
      --copy-bg:       #f0f0f0;
      --copy-bdr:      #dddddd;
      --copy-text:     #555555;
      --copy-done-bg:  #d4f8e8;
      --copy-done-text:#1a7a4a;
      --copy-done-bdr: #a8e6c8;
    }

    [data-theme="dark"] {
      --border-input:  #2e4a4a;
      --btn-sec-bg:    #0d2e2e;
      --btn-sec-text:  #00cccc;
      --btn-sec-bdr:   #1e3a3a;
      --btn-sec-hover: #1e4a4a;
      --copy-bg:       #1e2130;
      --copy-bdr:      #2a2d3e;
      --copy-text:     #94a3b8;
      --copy-done-bg:  #052e16;
      --copy-done-text:#86efac;
      --copy-done-bdr: #166534;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 20px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 2px solid var(--accent-light);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    /* ── Input ── */
    textarea#excel-input {
      width: 100%;
      min-height: 220px;
      padding: 14px;
      border: 2px solid var(--border-input);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    textarea#excel-input:focus { border-color: var(--accent); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-dark); }

    .btn-secondary {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 1px solid var(--btn-sec-bdr);
    }
    .btn-secondary:hover { background: var(--btn-sec-hover); }

    .btn-danger {
      background: #fde8e8;
      color: #a93226;
      border: 1px solid #f5b7b1;
    }
    .btn-danger:hover { background: #fbd0ce; }

    /* ── Markdown Output ── */
    .output-area {
      position: relative;
    }

    textarea#markdown-output {
      width: 100%;
      min-height: 200px;
      padding: 14px;
      border: 2px solid var(--border-input);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    textarea#markdown-output:focus { border-color: var(--accent); }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--copy-bg);
      border: 1px solid var(--copy-bdr);
      border-radius: 6px;
      cursor: pointer;
      color: var(--copy-text);
      transition: all 0.15s;
    }

    .copy-btn:hover { background: var(--btn-sec-bg); color: var(--btn-sec-text); border-color: var(--btn-sec-bdr); }
    .copy-btn.copied { background: var(--copy-done-bg); color: var(--copy-done-text); border-color: var(--copy-done-bdr); }

    @media (max-width: 640px) {
      .container { padding: 20px 12px 40px; }
      .card { padding: 16px; }
      textarea#excel-input { min-height: 160px; }
    }
  </style>
</head>
<body>

<script src="shared/header.js"></script>
<script>
  injectHeader({ icon: '<span style="font-size:1.3rem;">📊</span>', title: 'Excel to Markdown' });
</script>

<div class="container">

  <!-- Paste Input -->
  <div class="card">
    <h2 id="input-heading">Paste Excel Data</h2>
    <textarea id="excel-input" spellcheck="false"
      placeholder="Copy cells from Excel and paste them here...&#10;&#10;The tool will automatically detect rows and columns and convert them to a Markdown table."></textarea>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="convert()" id="btn-convert">🔄 Convert</button>
      <button class="btn btn-secondary" onclick="loadSample()" id="btn-sample">📋 Sample</button>
      <button class="btn btn-danger" onclick="clearAll()" id="btn-clear">🗑 Clear</button>
    </div>
  </div>

  <!-- Markdown Output -->
  <div class="card" id="output-card" style="display:none;">
    <h2 id="output-heading">Markdown Output</h2>
    <div class="output-area">
      <textarea id="markdown-output" readonly placeholder="Markdown table will appear here..."></textarea>
      <button class="copy-btn" id="copy-btn" onclick="copyMarkdown()">📋 Copy</button>
    </div>
  </div>

</div>

<script>
  // ══════════════════════════════════════════════════
  // i18n (dark mode handled by shared/header.js)
  // ══════════════════════════════════════════════════
  const TRANSLATIONS = {
    en: {
      pageTitle: 'Excel to Markdown',
      inputHeading: 'Paste Excel Data',
      inputPlaceholder: 'Copy cells from Excel and paste them here...\n\nThe tool will automatically detect rows and columns and convert them to a Markdown table.',
      btnConvert: '🔄 Convert',
      btnSample: '📋 Sample',
      btnClear: '🗑 Clear',
      outputHeading: 'Markdown Output',
      outputPlaceholder: 'Markdown table will appear here...',
      copyBtn: '📋 Copy',
      copiedBtn: '✅ Copied',
    },
    zh: {
      pageTitle: 'Excel 转 Markdown',
      inputHeading: '粘贴 Excel 数据',
      inputPlaceholder: '从 Excel 中复制单元格并粘贴到此处...\n\n工具将自动检测行和列，并将其转换为 Markdown 表格。',
      btnConvert: '🔄 转换',
      btnSample: '📋 示例',
      btnClear: '🗑 清除',
      outputHeading: 'Markdown 输出',
      outputPlaceholder: 'Markdown 表格将显示在此处...',
      copyBtn: '📋 复制',
      copiedBtn: '✅ 已复制',
    }
  };

  function pageApplyTranslations() {
    document.title = currentLang === 'zh' ? 'Excel 转 Markdown' : 'Excel to Markdown';

    document.getElementById('input-heading').textContent = t('inputHeading');
    document.getElementById('excel-input').placeholder = t('inputPlaceholder');
    document.getElementById('btn-convert').textContent = t('btnConvert');
    document.getElementById('btn-sample').textContent = t('btnSample');
    document.getElementById('btn-clear').textContent = t('btnClear');
    document.getElementById('output-heading').textContent = t('outputHeading');
    document.getElementById('markdown-output').placeholder = t('outputPlaceholder');
    document.getElementById('copy-btn').textContent = t('copyBtn');
  }

  // ══════════════════════════════════════════════════
  // Conversion Logic
  // ══════════════════════════════════════════════════
  let currentData = [];

  function parsePastedText(text) {
    const lines = text.split('\n').filter(line => line.trim() !== '');
    if (lines.length === 0) return [];

    return lines.map(line => {
      // Split by tab (Excel paste) or by pipe (already markdown-ish)
      if (line.includes('\t')) {
        return line.split('\t').map(cell => cell.trim());
      }
      // Try splitting by pipe for markdown-like input
      if (line.includes('|')) {
        return line.split('|').map(cell => cell.trim()).filter(c => c !== '');
      }
      // Fallback: split by comma
      return line.split(',').map(cell => cell.trim());
    });
  }

  function convert() {
    const input = document.getElementById('excel-input');
    const text = input.value.trim();
    if (!text) return;

    currentData = parsePastedText(text);

    if (currentData.length === 0) {
      document.getElementById('output-card').style.display = 'none';
      return;
    }

    renderMarkdown();

    document.getElementById('output-card').style.display = 'block';
  }

  function renderMarkdown() {
    const output = document.getElementById('markdown-output');

    if (currentData.length < 1) {
      output.value = '';
      return;
    }

    const maxCols = Math.max(...currentData.map(row => row.length));
    const headers = currentData[0];

    // Build header row
    let md = '| ';
    for (let i = 0; i < maxCols; i++) {
      md += escapeMdCell(headers[i] || '') + ' | ';
    }
    md = md.trimEnd() + '\n';

    // Build separator row
    md += '| ';
    for (let i = 0; i < maxCols; i++) {
      md += '--- | ';
    }
    md = md.trimEnd() + '\n';

    // Build data rows
    for (let i = 1; i < currentData.length; i++) {
      md += '| ';
      for (let j = 0; j < maxCols; j++) {
        md += escapeMdCell(currentData[i][j] || '') + ' | ';
      }
      md = md.trimEnd() + '\n';
    }

    output.value = md;
  }

  function escapeMdCell(text) {
    return text.replace(/\|/g, '\\|').replace(/\n/g, '<br>');
  }

  // ── Copy ──
  async function copyMarkdown() {
    const output = document.getElementById('markdown-output');
    if (!output.value.trim()) return;

    try {
      await navigator.clipboard.writeText(output.value);
      const btn = document.getElementById('copy-btn');
      btn.textContent = t('copiedBtn');
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = t('copyBtn');
        btn.classList.remove('copied');
      }, 2000);
    } catch {
      output.select();
      document.execCommand('copy');
    }
  }

  // ── Sample ──
  function loadSample() {
    document.getElementById('excel-input').value =
`Product\tCategory\tPrice\tStock
Widget A\tElectronics\t$19.99\t120
Widget B\tElectronics\t$29.99\t85
Gadget X\tHome\t$49.99\t200
Gadget Y\tHome\t$39.99\t150
Accessory Z\tAccessories\t$9.99\t500`;
    convert();
  }

  // ── Clear ──
  function clearAll() {
    document.getElementById('excel-input').value = '';
    document.getElementById('output-card').style.display = 'none';
    currentData = [];
  }

  // ══════════════════════════════════════════════════
  // Init (theme + translations handled by shared/header.js)
  // ══════════════════════════════════════════════════
</script>

</body>
</html>
