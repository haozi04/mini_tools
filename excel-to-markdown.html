<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Excel to Markdown</title>
  <meta name="description" content="Convert Excel (.xlsx) data into clean Markdown tables." />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* ══════════════════════════════════════════════
       CSS CUSTOM PROPERTIES — Light (default)
       ══════════════════════════════════════════════ */
    :root {
      --bg:            #f0f2f5;
      --surface:       #ffffff;
      --surface-alt:   #f7fafa;
      --border:        #e0eeee;
      --border-input:  #cce8e8;
      --text-primary:  #1a1a2e;
      --text-muted:    #666666;
      --text-faint:    #aaaaaa;
      --accent:        #009999;
      --accent-dark:   #007a7a;
      --accent-light:  #e0f5f5;
      --shadow:        rgba(0,0,0,0.08);
      --btn-sec-bg:    #e0f5f5;
      --btn-sec-text:  #007777;
      --btn-sec-bdr:   #b2e0e0;
      --btn-sec-hover: #c5ecec;
      --copy-bg:       #f0f0f0;
      --copy-bdr:      #dddddd;
      --copy-text:     #555555;
      --copy-done-bg:  #d4f8e8;
      --copy-done-text:#1a7a4a;
      --copy-done-bdr: #a8e6c8;
      --dropzone-bdr:  #cce8e8;
      --dropzone-bg:   #f7fdfd;
      --dropzone-hover:#e0f5f5;
      --switcher-bg:      rgba(255,255,255,0.16);
      --switcher-text:    #ffffff;
      --switcher-bdr:     rgba(255,255,255,0.35);
      --switcher-hover:   rgba(255,255,255,0.24);
      --switcher-act-bg:  #ffffff;
      --switcher-act-txt: #009999;
    }

    /* ══════════════════════════════════════════════
       DARK MODE OVERRIDES
       ══════════════════════════════════════════════ */
    [data-theme="dark"] {
      --bg:            #0f1117;
      --surface:       #1a1d27;
      --surface-alt:   #1e2130;
      --border:        #2a2d3e;
      --border-input:  #2e4a4a;
      --text-primary:  #e2e8f0;
      --text-muted:    #94a3b8;
      --text-faint:    #4a5568;
      --accent:        #00cccc;
      --accent-dark:   #00aaaa;
      --accent-light:  #0d2e2e;
      --shadow:        rgba(0,0,0,0.4);
      --btn-sec-bg:    #0d2e2e;
      --btn-sec-text:  #00cccc;
      --btn-sec-bdr:   #1e3a3a;
      --btn-sec-hover: #1e4a4a;
      --copy-bg:       #1e2130;
      --copy-bdr:      #2a2d3e;
      --copy-text:     #94a3b8;
      --copy-done-bg:  #052e16;
      --copy-done-text:#86efac;
      --copy-done-bdr: #166534;
      --dropzone-bdr:  #2e4a4a;
      --dropzone-bg:   #0d1e1e;
      --dropzone-hover:#1e3a3a;
      --switcher-bg:      rgba(255,255,255,0.10);
      --switcher-text:    #e2e8f0;
      --switcher-bdr:     rgba(255,255,255,0.25);
      --switcher-hover:   rgba(255,255,255,0.18);
      --switcher-act-bg:  #00cccc;
      --switcher-act-txt: #0f1117;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header a { color: white; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .switcher {
      display: flex;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--switcher-bdr);
    }

    .switcher-btn {
      padding: 6px 12px;
      border: none;
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }

    .switcher-btn + .switcher-btn { border-left: 1px solid var(--switcher-bdr); }
    .switcher-btn.active { background: var(--switcher-act-bg); color: var(--switcher-act-txt); }
    .switcher-btn:hover:not(.active) { background: var(--switcher-hover); }

    .dark-toggle {
      width: 32px; height: 30px;
      border-radius: 999px;
      border: 1px solid var(--switcher-bdr);
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .dark-toggle:hover { background: var(--switcher-hover); }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 20px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 2px solid var(--accent-light);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    /* ── Dropzone ── */
    .dropzone {
      border: 2px dashed var(--dropzone-bdr);
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--dropzone-bg);
    }

    .dropzone:hover, .dropzone.drag-over {
      border-color: var(--accent);
      background: var(--dropzone-hover);
    }

    .dropzone-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .dropzone-text { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 6px; }
    .dropzone-hint { font-size: 0.78rem; color: var(--text-faint); }

    .dropzone input[type="file"] { display: none; }

    /* ── Sheet Selector ── */
    .sheet-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .sheet-btn {
      padding: 6px 14px;
      border: 1px solid var(--border-input);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sheet-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .sheet-btn:hover:not(.active) { background: var(--accent-light); }

    /* ── Preview Table ── */
    .table-wrapper {
      overflow-x: auto;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table th {
      background: var(--accent);
      color: white;
      padding: 8px 10px;
      text-align: left;
      font-weight: 700;
      white-space: nowrap;
    }

    table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }

    table tr:nth-child(even) td { background: var(--surface-alt); }

    /* ── Markdown Output ── */
    .output-area {
      position: relative;
    }

    textarea#markdown-output {
      width: 100%;
      min-height: 200px;
      padding: 14px;
      border: 2px solid var(--border-input);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    textarea#markdown-output:focus { border-color: var(--accent); }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--copy-bg);
      border: 1px solid var(--copy-bdr);
      border-radius: 6px;
      cursor: pointer;
      color: var(--copy-text);
      transition: all 0.15s;
    }

    .copy-btn:hover { background: var(--btn-sec-bg); color: var(--btn-sec-text); border-color: var(--btn-sec-bdr); }
    .copy-btn.copied { background: var(--copy-done-bg); color: var(--copy-done-text); border-color: var(--copy-done-bdr); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-dark); }

    .btn-secondary {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 1px solid var(--btn-sec-bdr);
    }
    .btn-secondary:hover { background: var(--btn-sec-hover); }

    .file-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-faint);
    }

    .empty-state .icon { font-size: 2rem; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .container { padding: 20px 12px 40px; }
      .card { padding: 16px; }
      .dropzone { padding: 24px 14px; }
      .dropzone-icon { font-size: 2rem; }
      .file-info { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html">
    <span style="font-size:1.3rem;">📊</span>
    <h1 id="page-title">Excel to Markdown</h1>
  </a>
  <div class="header-actions">
    <div class="switcher">
      <button class="switcher-btn" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="switcher-btn" id="btn-zh" onclick="setLang('zh')">中文</button>
    </div>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
  </div>
</header>

<div class="container">

  <!-- Upload -->
  <div class="card">
    <h2 id="upload-heading">Upload Excel File</h2>
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">📂</div>
      <div class="dropzone-text" id="dropzone-text">Drop an .xlsx file here or click to browse</div>
      <div class="dropzone-hint" id="dropzone-hint">Supports .xlsx files up to 10 MB</div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" />
    </div>
  </div>

  <!-- Sheet selector + preview -->
  <div class="card" id="data-card" style="display:none;">
    <div class="toolbar">
      <h2 id="preview-heading">Preview</h2>
      <span class="file-info" id="file-info"></span>
    </div>
    <div class="sheet-bar" id="sheet-bar"></div>
    <div class="table-wrapper" id="preview-table-wrapper">
      <div class="empty-state">
        <div class="icon">📋</div>
        <div id="empty-preview-text">Select a sheet to preview</div>
      </div>
    </div>
  </div>

  <!-- Markdown Output -->
  <div class="card" id="output-card" style="display:none;">
    <h2 id="output-heading">Markdown Output</h2>
    <div class="output-area">
      <textarea id="markdown-output" readonly placeholder="Markdown table will appear here..."></textarea>
      <button class="copy-btn" id="copy-btn" onclick="copyMarkdown()">📋 Copy</button>
    </div>
  </div>

</div>

<script>
  // ══════════════════════════════════════════════════
  // DARK MODE
  // ══════════════════════════════════════════════════
  const DARK_KEY = 'miniToolsDark';

  function getInitialTheme() {
    const saved = localStorage.getItem(DARK_KEY);
    if (saved !== null) return saved === 'true';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  let isDark = getInitialTheme();

  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const btn = document.getElementById('darkToggle');
    if (btn) {
      btn.textContent = dark ? '☀️' : '🌙';
      btn.title = dark
        ? (currentLang === 'zh' ? '切换到浅色模式' : 'Switch to light mode')
        : (currentLang === 'zh' ? '切换到深色模式' : 'Switch to dark mode');
    }
  }

  function toggleDark() {
    isDark = !isDark;
    localStorage.setItem(DARK_KEY, isDark);
    applyTheme(isDark);
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (localStorage.getItem(DARK_KEY) === null) {
      isDark = e.matches;
      applyTheme(isDark);
    }
  });

  // ══════════════════════════════════════════════════
  // i18n
  // ══════════════════════════════════════════════════
  const TRANSLATIONS = {
    en: {
      pageTitle: 'Excel to Markdown',
      uploadHeading: 'Upload Excel File',
      dropzoneText: 'Drop an .xlsx file here or click to browse',
      dropzoneHint: 'Supports .xlsx files up to 10 MB',
      previewHeading: 'Preview',
      emptyPreviewText: 'Select a sheet to preview',
      outputHeading: 'Markdown Output',
      outputPlaceholder: 'Markdown table will appear here...',
      copyBtn: '📋 Copy',
      copiedBtn: '✅ Copied',
      rows: 'rows',
      cols: 'cols',
      sheet: 'Sheet',
      noData: 'No data found in this sheet.',
      fileInfo: (name, sheets) => `${name} — ${sheets} sheet(s)`,
    },
    zh: {
      pageTitle: 'Excel 转 Markdown',
      uploadHeading: '上传 Excel 文件',
      dropzoneText: '将 .xlsx 文件拖放到此处或点击浏览',
      dropzoneHint: '支持最大 10 MB 的 .xlsx 文件',
      previewHeading: '预览',
      emptyPreviewText: '选择一个工作表进行预览',
      outputHeading: 'Markdown 输出',
      outputPlaceholder: 'Markdown 表格将显示在此处...',
      copyBtn: '📋 复制',
      copiedBtn: '✅ 已复制',
      rows: '行',
      cols: '列',
      sheet: '工作表',
      noData: '此工作表中未找到数据。',
      fileInfo: (name, sheets) => `${name} — ${sheets} 个工作表`,
    }
  };

  let currentLang = (navigator.language || navigator.userLanguage || 'en')
                      .toLowerCase().startsWith('zh') ? 'zh' : 'en';

  function t(key) {
    return TRANSLATIONS[currentLang][key] || TRANSLATIONS['en'][key] || key;
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    document.title = currentLang === 'zh' ? 'Excel 转 Markdown' : 'Excel to Markdown';

    const titleEl = document.getElementById('page-title');
    if (titleEl) titleEl.textContent = t('pageTitle');

    document.getElementById('upload-heading').textContent = t('uploadHeading');
    document.getElementById('dropzone-text').textContent = t('dropzoneText');
    document.getElementById('dropzone-hint').textContent = t('dropzoneHint');
    document.getElementById('preview-heading').textContent = t('previewHeading');
    document.getElementById('empty-preview-text').textContent = t('emptyPreviewText');
    document.getElementById('output-heading').textContent = t('outputHeading');
    document.getElementById('markdown-output').placeholder = t('outputPlaceholder');
    document.getElementById('copy-btn').textContent = t('copyBtn');

    document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
    document.getElementById('btn-zh').classList.toggle('active', currentLang === 'zh');

    applyTheme(isDark);
  }

  function setLang(lang) {
    currentLang = lang;
    applyTranslations();
    // Re-render UI with new language
    if (currentWorkbook) {
      renderSheetBar();
      renderPreview(currentSheetName);
      renderMarkdown();
    }
  }

  // ══════════════════════════════════════════════════
  // Excel Logic
  // ══════════════════════════════════════════════════
  let currentWorkbook = null;
  let currentSheetName = null;
  let currentData = [];

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');

  // ── Drag & Drop ──
  dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('drag-over');
  });

  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('drag-over');
  });

  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    if (files.length > 0) handleFile(files[0]);
  });

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    if (e.target.files.length > 0) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    if (!file.name.match(/\.xlsx?$/i)) {
      alert('Please select an .xlsx file.');
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        currentWorkbook = XLSX.read(data, { type: 'array' });
        currentSheetName = currentWorkbook.SheetNames[0];
        loadSheet(currentSheetName);
        document.getElementById('data-card').style.display = 'block';
        document.getElementById('output-card').style.display = 'block';
        renderSheetBar();
        renderPreview(currentSheetName);
        renderMarkdown();
        updateFileInfo(file.name);
      } catch (err) {
        alert('Error reading file: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function loadSheet(name) {
    currentSheetName = name;
    const sheet = currentWorkbook.Sheets[name];
    const json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    // Filter out completely empty rows
    currentData = json.filter(row => row.some(cell => cell !== ''));
  }

  function renderSheetBar() {
    const bar = document.getElementById('sheet-bar');
    bar.innerHTML = '';
    currentWorkbook.SheetNames.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'sheet-btn' + (name === currentSheetName ? ' active' : '');
      btn.textContent = name;
      btn.onclick = () => {
        loadSheet(name);
        renderSheetBar();
        renderPreview(name);
        renderMarkdown();
      };
      bar.appendChild(btn);
    });
  }

  function renderPreview(name) {
    const wrapper = document.getElementById('preview-table-wrapper');
    if (currentData.length === 0) {
      wrapper.innerHTML = `<div class="empty-state"><div class="icon">📋</div><div>${t('noData')}</div></div>`;
      return;
    }

    let html = '<table><thead><tr>';
    const headers = currentData[0];
    headers.forEach(h => {
      html += `<th>${escapeHtml(String(h))}</th>`;
    });
    html += '</tr></thead><tbody>';

    for (let i = 1; i < currentData.length; i++) {
      html += '<tr>';
      currentData[i].forEach(cell => {
        html += `<td>${escapeHtml(String(cell))}</td>`;
      });
      html += '</tr>';
    }

    html += '</tbody></table>';
    wrapper.innerHTML = html;
  }

  function renderMarkdown() {
    const output = document.getElementById('markdown-output');
    if (currentData.length < 2) {
      output.value = '';
      return;
    }

    const headers = currentData[0];
    const rows = currentData.slice(1);

    // Build header row
    let md = '| ' + headers.map(h => escapeMdCell(String(h))).join(' | ') + ' |\n';

    // Build separator row
    md += '| ' + headers.map(() => '---').join(' | ') + ' |\n';

    // Build data rows
    rows.forEach(row => {
      md += '| ';
      for (let i = 0; i < headers.length; i++) {
        md += escapeMdCell(String(row[i] || '')) + ' | ';
      }
      md = md.trimEnd() + '\n';
    });

    output.value = md;
  }

  function escapeMdCell(text) {
    return text.replace(/\|/g, '\\|').replace(/\n/g, '<br>');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function updateFileInfo(name) {
    const info = document.getElementById('file-info');
    info.textContent = t('fileInfo')(name, currentWorkbook.SheetNames.length);
  }

  // ── Copy ──
  async function copyMarkdown() {
    const output = document.getElementById('markdown-output');
    if (!output.value.trim()) return;

    try {
      await navigator.clipboard.writeText(output.value);
      const btn = document.getElementById('copy-btn');
      btn.textContent = t('copiedBtn');
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = t('copyBtn');
        btn.classList.remove('copied');
      }, 2000);
    } catch {
      output.select();
      document.execCommand('copy');
    }
  }

  // ══════════════════════════════════════════════════
  // Init
  // ══════════════════════════════════════════════════
  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(isDark);
    applyTranslations();
  });
</script>

</body>
</html>
