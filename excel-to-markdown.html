<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Excel to Markdown</title>
  <meta name="description" content="Paste Excel data and convert to clean Markdown tables." />
  <style>
    /* ══════════════════════════════════════════════
       CSS CUSTOM PROPERTIES — Light (default)
       ══════════════════════════════════════════════ */
    :root {
      --bg:            #f0f2f5;
      --surface:       #ffffff;
      --surface-alt:   #f7fafa;
      --border:        #e0eeee;
      --border-input:  #cce8e8;
      --text-primary:  #1a1a2e;
      --text-muted:    #666666;
      --text-faint:    #aaaaaa;
      --accent:        #009999;
      --accent-dark:   #007a7a;
      --accent-light:  #e0f5f5;
      --shadow:        rgba(0,0,0,0.08);
      --btn-sec-bg:    #e0f5f5;
      --btn-sec-text:  #007777;
      --btn-sec-bdr:   #b2e0e0;
      --btn-sec-hover: #c5ecec;
      --copy-bg:       #f0f0f0;
      --copy-bdr:      #dddddd;
      --copy-text:     #555555;
      --copy-done-bg:  #d4f8e8;
      --copy-done-text:#1a7a4a;
      --copy-done-bdr: #a8e6c8;
      --switcher-bg:      rgba(255,255,255,0.16);
      --switcher-text:    #ffffff;
      --switcher-bdr:     rgba(255,255,255,0.35);
      --switcher-hover:   rgba(255,255,255,0.24);
      --switcher-act-bg:  #ffffff;
      --switcher-act-txt: #009999;
    }

    /* ══════════════════════════════════════════════
       DARK MODE OVERRIDES
       ══════════════════════════════════════════════ */
    [data-theme="dark"] {
      --bg:            #0f1117;
      --surface:       #1a1d27;
      --surface-alt:   #1e2130;
      --border:        #2a2d3e;
      --border-input:  #2e4a4a;
      --text-primary:  #e2e8f0;
      --text-muted:    #94a3b8;
      --text-faint:    #4a5568;
      --accent:        #00cccc;
      --accent-dark:   #00aaaa;
      --accent-light:  #0d2e2e;
      --shadow:        rgba(0,0,0,0.4);
      --btn-sec-bg:    #0d2e2e;
      --btn-sec-text:  #00cccc;
      --btn-sec-bdr:   #1e3a3a;
      --btn-sec-hover: #1e4a4a;
      --copy-bg:       #1e2130;
      --copy-bdr:      #2a2d3e;
      --copy-text:     #94a3b8;
      --copy-done-bg:  #052e16;
      --copy-done-text:#86efac;
      --copy-done-bdr: #166534;
      --switcher-bg:      rgba(255,255,255,0.10);
      --switcher-text:    #e2e8f0;
      --switcher-bdr:     rgba(255,255,255,0.25);
      --switcher-hover:   rgba(255,255,255,0.18);
      --switcher-act-bg:  #00cccc;
      --switcher-act-txt: #0f1117;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header a { color: white; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .switcher {
      display: flex;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--switcher-bdr);
    }

    .switcher-btn {
      padding: 6px 12px;
      border: none;
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }

    .switcher-btn + .switcher-btn { border-left: 1px solid var(--switcher-bdr); }
    .switcher-btn.active { background: var(--switcher-act-bg); color: var(--switcher-act-txt); }
    .switcher-btn:hover:not(.active) { background: var(--switcher-hover); }

    .dark-toggle {
      width: 32px; height: 30px;
      border-radius: 999px;
      border: 1px solid var(--switcher-bdr);
      background: var(--switcher-bg);
      color: var(--switcher-text);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .dark-toggle:hover { background: var(--switcher-hover); }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px var(--shadow);
      margin-bottom: 20px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      border-bottom: 2px solid var(--accent-light);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    /* ── Input ── */
    textarea#excel-input {
      width: 100%;
      min-height: 220px;
      padding: 14px;
      border: 2px solid var(--border-input);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    textarea#excel-input:focus { border-color: var(--accent); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-dark); }

    .btn-secondary {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 1px solid var(--btn-sec-bdr);
    }
    .btn-secondary:hover { background: var(--btn-sec-hover); }

    .btn-danger {
      background: #fde8e8;
      color: #a93226;
      border: 1px solid #f5b7b1;
    }
    .btn-danger:hover { background: #fbd0ce; }

    /* ── Preview Table ── */
    .table-wrapper {
      overflow-x: auto;
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table th {
      background: var(--accent);
      color: white;
      padding: 8px 10px;
      text-align: left;
      font-weight: 700;
      white-space: nowrap;
    }

    table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }

    table tr:nth-child(even) td { background: var(--surface-alt); }

    /* ── Markdown Output ── */
    .output-area {
      position: relative;
    }

    textarea#markdown-output {
      width: 100%;
      min-height: 200px;
      padding: 14px;
      border: 2px solid var(--border-input);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    textarea#markdown-output:focus { border-color: var(--accent); }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 5px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--copy-bg);
      border: 1px solid var(--copy-bdr);
      border-radius: 6px;
      cursor: pointer;
      color: var(--copy-text);
      transition: all 0.15s;
    }

    .copy-btn:hover { background: var(--btn-sec-bg); color: var(--btn-sec-text); border-color: var(--btn-sec-bdr); }
    .copy-btn.copied { background: var(--copy-done-bg); color: var(--copy-done-text); border-color: var(--copy-done-bdr); }

    .info-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .info-bar .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .info-bar .stat-value {
      font-weight: 700;
      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-faint);
    }

    .empty-state .icon { font-size: 2rem; margin-bottom: 8px; }

    @media (max-width: 640px) {
      .container { padding: 20px 12px 40px; }
      .card { padding: 16px; }
      textarea#excel-input { min-height: 160px; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html">
    <span style="font-size:1.3rem;">📊</span>
    <h1 id="page-title">Excel to Markdown</h1>
  </a>
  <div class="header-actions">
    <div class="switcher">
      <button class="switcher-btn" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="switcher-btn" id="btn-zh" onclick="setLang('zh')">中文</button>
    </div>
    <button class="dark-toggle" id="darkToggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>
  </div>
</header>

<div class="container">

  <!-- Paste Input -->
  <div class="card">
    <h2 id="input-heading">Paste Excel Data</h2>
    <textarea id="excel-input" spellcheck="false"
      placeholder="Copy cells from Excel and paste them here...&#10;&#10;The tool will automatically detect rows and columns and convert them to a Markdown table."></textarea>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="convert()" id="btn-convert">🔄 Convert</button>
      <button class="btn btn-secondary" onclick="loadSample()" id="btn-sample">📋 Sample</button>
      <button class="btn btn-danger" onclick="clearAll()" id="btn-clear">🗑 Clear</button>
    </div>
  </div>

  <!-- Preview -->
  <div class="card" id="preview-card" style="display:none;">
    <div class="toolbar">
      <h2 id="preview-heading">Preview</h2>
      <div class="info-bar" id="info-bar">
        <span class="stat"><span class="stat-value" id="stat-rows">0</span> <span id="stat-rows-label">rows</span></span>
        <span class="stat"><span class="stat-value" id="stat-cols">0</span> <span id="stat-cols-label">cols</span></span>
      </div>
    </div>
    <div class="table-wrapper" id="preview-table-wrapper">
      <div class="empty-state">
        <div class="icon">📋</div>
        <div id="empty-preview-text">Paste data and click Convert to preview</div>
      </div>
    </div>
  </div>

  <!-- Markdown Output -->
  <div class="card" id="output-card" style="display:none;">
    <h2 id="output-heading">Markdown Output</h2>
    <div class="output-area">
      <textarea id="markdown-output" readonly placeholder="Markdown table will appear here..."></textarea>
      <button class="copy-btn" id="copy-btn" onclick="copyMarkdown()">📋 Copy</button>
    </div>
  </div>

</div>

<script>
  // ══════════════════════════════════════════════════
  // DARK MODE
  // ══════════════════════════════════════════════════
  const DARK_KEY = 'miniToolsDark';

  function getInitialTheme() {
    const saved = localStorage.getItem(DARK_KEY);
    if (saved !== null) return saved === 'true';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  let isDark = getInitialTheme();

  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const btn = document.getElementById('darkToggle');
    if (btn) {
      btn.textContent = dark ? '☀️' : '🌙';
      btn.title = dark
        ? (currentLang === 'zh' ? '切换到浅色模式' : 'Switch to light mode')
        : (currentLang === 'zh' ? '切换到深色模式' : 'Switch to dark mode');
    }
  }

  function toggleDark() {
    isDark = !isDark;
    localStorage.setItem(DARK_KEY, isDark);
    applyTheme(isDark);
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (localStorage.getItem(DARK_KEY) === null) {
      isDark = e.matches;
      applyTheme(isDark);
    }
  });

  // ══════════════════════════════════════════════════
  // i18n
  // ══════════════════════════════════════════════════
  const TRANSLATIONS = {
    en: {
      pageTitle: 'Excel to Markdown',
      inputHeading: 'Paste Excel Data',
      inputPlaceholder: 'Copy cells from Excel and paste them here...\n\nThe tool will automatically detect rows and columns and convert them to a Markdown table.',
      btnConvert: '🔄 Convert',
      btnSample: '📋 Sample',
      btnClear: '🗑 Clear',
      previewHeading: 'Preview',
      emptyPreviewText: 'Paste data and click Convert to preview',
      outputHeading: 'Markdown Output',
      outputPlaceholder: 'Markdown table will appear here...',
      copyBtn: '📋 Copy',
      copiedBtn: '✅ Copied',
      rowsLabel: 'rows',
      colsLabel: 'cols',
    },
    zh: {
      pageTitle: 'Excel 转 Markdown',
      inputHeading: '粘贴 Excel 数据',
      inputPlaceholder: '从 Excel 中复制单元格并粘贴到此处...\n\n工具将自动检测行和列，并将其转换为 Markdown 表格。',
      btnConvert: '🔄 转换',
      btnSample: '📋 示例',
      btnClear: '🗑 清除',
      previewHeading: '预览',
      emptyPreviewText: '粘贴数据并点击转换以预览',
      outputHeading: 'Markdown 输出',
      outputPlaceholder: 'Markdown 表格将显示在此处...',
      copyBtn: '📋 复制',
      copiedBtn: '✅ 已复制',
      rowsLabel: '行',
      colsLabel: '列',
    }
  };

  let currentLang = (navigator.language || navigator.userLanguage || 'en')
                      .toLowerCase().startsWith('zh') ? 'zh' : 'en';

  function t(key) {
    return TRANSLATIONS[currentLang][key] || TRANSLATIONS['en'][key] || key;
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    document.title = currentLang === 'zh' ? 'Excel 转 Markdown' : 'Excel to Markdown';

    const titleEl = document.getElementById('page-title');
    if (titleEl) titleEl.textContent = t('pageTitle');

    document.getElementById('input-heading').textContent = t('inputHeading');
    document.getElementById('excel-input').placeholder = t('inputPlaceholder');
    document.getElementById('btn-convert').textContent = t('btnConvert');
    document.getElementById('btn-sample').textContent = t('btnSample');
    document.getElementById('btn-clear').textContent = t('btnClear');
    document.getElementById('preview-heading').textContent = t('previewHeading');
    document.getElementById('empty-preview-text').textContent = t('emptyPreviewText');
    document.getElementById('output-heading').textContent = t('outputHeading');
    document.getElementById('markdown-output').placeholder = t('outputPlaceholder');
    document.getElementById('copy-btn').textContent = t('copyBtn');
    document.getElementById('stat-rows-label').textContent = t('rowsLabel');
    document.getElementById('stat-cols-label').textContent = t('colsLabel');

    document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
    document.getElementById('btn-zh').classList.toggle('active', currentLang === 'zh');

    applyTheme(isDark);
  }

  function setLang(lang) {
    currentLang = lang;
    applyTranslations();
  }

  // ══════════════════════════════════════════════════
  // Conversion Logic
  // ══════════════════════════════════════════════════
  let currentData = [];

  function parsePastedText(text) {
    const lines = text.split('\n').filter(line => line.trim() !== '');
    if (lines.length === 0) return [];

    return lines.map(line => {
      // Split by tab (Excel paste) or by pipe (already markdown-ish)
      if (line.includes('\t')) {
        return line.split('\t').map(cell => cell.trim());
      }
      // Try splitting by pipe for markdown-like input
      if (line.includes('|')) {
        return line.split('|').map(cell => cell.trim()).filter(c => c !== '');
      }
      // Fallback: split by comma
      return line.split(',').map(cell => cell.trim());
    });
  }

  function convert() {
    const input = document.getElementById('excel-input');
    const text = input.value.trim();
    if (!text) return;

    currentData = parsePastedText(text);

    if (currentData.length === 0) {
      document.getElementById('preview-card').style.display = 'none';
      document.getElementById('output-card').style.display = 'none';
      return;
    }

    renderPreview();
    renderMarkdown();

    document.getElementById('preview-card').style.display = 'block';
    document.getElementById('output-card').style.display = 'block';
  }

  function renderPreview() {
    const wrapper = document.getElementById('preview-table-wrapper');

    const maxCols = Math.max(...currentData.map(row => row.length));

    document.getElementById('stat-rows').textContent = currentData.length;
    document.getElementById('stat-cols').textContent = maxCols;

    let html = '<table><thead><tr>';
    const headers = currentData[0];
    for (let i = 0; i < maxCols; i++) {
      html += `<th>${escapeHtml(headers[i] || '')}</th>`;
    }
    html += '</tr></thead><tbody>';

    for (let i = 1; i < currentData.length; i++) {
      html += '<tr>';
      for (let j = 0; j < maxCols; j++) {
        html += `<td>${escapeHtml(currentData[i][j] || '')}</td>`;
      }
      html += '</tr>';
    }

    html += '</tbody></table>';
    wrapper.innerHTML = html;
  }

  function renderMarkdown() {
    const output = document.getElementById('markdown-output');

    if (currentData.length < 1) {
      output.value = '';
      return;
    }

    const maxCols = Math.max(...currentData.map(row => row.length));
    const headers = currentData[0];

    // Build header row
    let md = '| ';
    for (let i = 0; i < maxCols; i++) {
      md += escapeMdCell(headers[i] || '') + ' | ';
    }
    md = md.trimEnd() + '\n';

    // Build separator row
    md += '| ';
    for (let i = 0; i < maxCols; i++) {
      md += '--- | ';
    }
    md = md.trimEnd() + '\n';

    // Build data rows
    for (let i = 1; i < currentData.length; i++) {
      md += '| ';
      for (let j = 0; j < maxCols; j++) {
        md += escapeMdCell(currentData[i][j] || '') + ' | ';
      }
      md = md.trimEnd() + '\n';
    }

    output.value = md;
  }

  function escapeMdCell(text) {
    return text.replace(/\|/g, '\\|').replace(/\n/g, '<br>');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ── Copy ──
  async function copyMarkdown() {
    const output = document.getElementById('markdown-output');
    if (!output.value.trim()) return;

    try {
      await navigator.clipboard.writeText(output.value);
      const btn = document.getElementById('copy-btn');
      btn.textContent = t('copiedBtn');
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = t('copyBtn');
        btn.classList.remove('copied');
      }, 2000);
    } catch {
      output.select();
      document.execCommand('copy');
    }
  }

  // ── Sample ──
  function loadSample() {
    document.getElementById('excel-input').value =
`Product\tCategory\tPrice\tStock
Widget A\tElectronics\t$19.99\t120
Widget B\tElectronics\t$29.99\t85
Gadget X\tHome\t$49.99\t200
Gadget Y\tHome\t$39.99\t150
Accessory Z\tAccessories\t$9.99\t500`;
    convert();
  }

  // ── Clear ──
  function clearAll() {
    document.getElementById('excel-input').value = '';
    document.getElementById('preview-card').style.display = 'none';
    document.getElementById('output-card').style.display = 'none';
    currentData = [];
  }

  // ══════════════════════════════════════════════════
  // Init
  // ══════════════════════════════════════════════════
  document.addEventListener('DOMContentLoaded', () => {
    applyTheme(isDark);
    applyTranslations();
  });
</script>

</body>
</html>
